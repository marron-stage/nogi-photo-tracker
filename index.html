<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生写真販売カウントダウン＆駿河屋サーチ</title>
  <style>
    :root {
      --primary: #7e22ce;
      --primary-light: #f3e8ff;
      --primary-dark: #581c87;
      --bg: #faf8fc;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --surugaya: #004098;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 60px;
    }
    header {
      background: linear-gradient(135deg, var(--primary), #9333ea);
      color: #fff;
      padding: 16px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(126, 34, 206, 0.25);
    }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    header p { font-size: 0.78rem; opacity: 0.9; margin-top: 3px; }

    .container { max-width: 820px; margin: 0 auto; padding: 16px; }

    /* 推しメン絞り込みバー */
    .oshi-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .oshi-bar label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 6px;
    }
    .oshi-input-row { display: flex; gap: 8px; }
    .oshi-input-row input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .preset-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .chip {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: none;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .chip:hover { background: #e9d5ff; }
    .chip.clear { background: #f3f4f6; color: #4b5563; }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-edit-save { background: #059669; color: #fff; }
    .btn-surugaya { background: var(--surugaya); color: #fff; width: 100%; }
    .btn-outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
    .btn-sm { padding: 5px 8px; font-size: 0.72rem; border-radius: 6px; }

    /* 管理画面パネル（?admin=1 + パスワード認証時のみ表示） */
    .admin-panel {
      display: none;
      background: #fff;
      border: 2px solid var(--primary);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(126, 34, 206, 0.1);
    }
    .admin-panel.open { display: block; }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .admin-header h2 { font-size: 0.95rem; color: var(--primary-dark); }
    .form-grid { display: grid; gap: 10px; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 700; margin-bottom: 3px; }
    .form-group input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .preview-thumb {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 8px;
      margin-top: 6px;
      display: none;
      border: 1px solid var(--border);
      background: #f9fafb;
    }
    .admin-export-box {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 14px;
    }
    .admin-export-box p { font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; }

    /* カード一覧：2列グリッド */
    .card-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (max-width: 540px) {
      .card-list { grid-template-columns: 1fr; }
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      background: #fff;
      border-radius: 16px;
      border: 1px dashed #d1d5db;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
    }
    .card.editing {
      border: 2px solid #059669;
    }
    .banner-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
    .banner-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .banner-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #6b21a8, #c084fc);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .status-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      z-index: 2;
    }
    .badge-active { background: #e11d48; }
    .badge-ended { background: var(--surugaya); }

    .card-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 4px;
      line-height: 1.35;
    }
    .card-meta {
      font-size: 0.74rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .card-action-area { margin-top: auto; }

    .countdown-box {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 9px;
      padding: 8px 10px;
      text-align: center;
      margin-bottom: 10px;
    }
    .countdown-label { font-size: 0.68rem; color: #be123c; font-weight: 700; }
    .countdown-time {
      font-size: 1.08rem;
      font-weight: 900;
      color: #9f1239;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    .resale-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 9px;
      padding: 10px;
    }
    .resale-title {
      font-size: 0.74rem;
      font-weight: 800;
      color: #1e3a8a;
      margin-bottom: 4px;
    }
    .search-preview {
      font-size: 0.72rem;
      color: #1d4ed8;
      background: #fff;
      padding: 4px 7px;
      border-radius: 5px;
      margin-bottom: 8px;
      word-break: break-all;
    }

    /* 管理モード認証済み時のみ表示されるカード操作ボタン */
    .admin-card-controls {
      display: none;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 10px;
      gap: 4px;
      flex-wrap: wrap;
    }
    body.is-admin .admin-card-controls { display: flex; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <h1>💜 生写真カウントダウン＆駿河屋サーチ</h1>
  <p>予約締切タイマー ＆ 発売後の駿河屋在庫一発検索</p>
</header>

<div class="container">
  <!-- 管理画面（?admin=1 かつパスワード 4648 認証時のみ表示） -->
  <div class="admin-panel" id="adminPanel">
    <div class="admin-header">
      <h2 id="formHeading">🛠️ 管理画面（新規アイテム登録）</h2>
      <span style="font-size:0.75rem; color:#059669; font-weight:700;">認証済み</span>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>1. バナー画像を選択（1040×1040正方形そのまま表示）</label>
        <input type="file" id="inFile" accept="image/*" onchange="handleImageFile(event)" />
        <img id="previewImg" class="preview-thumb" alt="プレビュー" />
      </div>
      <div class="form-group">
        <label>または バナー画像URL（直接貼る場合）</label>
        <input type="url" id="inBannerUrl" placeholder="https://..." />
      </div>
      <div class="form-group">
        <label>2. タイトル（生写真テーマ名）*</label>
        <input type="text" id="inTitle" placeholder="例：2026年11月個別生写真【クリスマス2026】" />
      </div>
      <div class="form-group">
        <label>3. 予約締切日時 *</label>
        <input type="datetime-local" id="inDeadline" />
      </div>
      <div class="form-group">
        <label>4. お届け予定メモ（任意）</label>
        <input type="text" id="inDelivery" placeholder="例：12月中旬〜下旬お届け予定" />
      </div>
      <div class="form-group">
        <label>5. 公式ショップURL</label>
        <input type="url" id="inShopUrl" value="https://www.nogizaka46shop.com/" />
      </div>
      <div class="form-group">
        <label>6. 駿河屋 検索用ベースキーワード</label>
        <input type="text" id="inKeyword" placeholder="例：乃木坂46 生写真 クリスマス2026" />
      </div>

      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-primary" id="submitBtn" onclick="saveItem()">＋ この内容で追加する</button>
        <button class="btn btn-outline" id="cancelEditBtn" style="display:none;" onclick="cancelEdit()">編集をキャンセル</button>
      </div>
    </div>

    <div class="admin-export-box">
      <p><strong>📤 GitHub反映手順：</strong><br>
      追加・修正が終わったら下のボタンで <code>data.json</code> をダウンロードし、GitHubにドラッグ＆ドロップで上書きアップロードしてください。</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" onclick="downloadJson()">💾 GitHub用 data.json を保存</button>
        <button class="btn btn-outline btn-sm" onclick="clearAllItems()" style="color:#dc2626; border-color:#dc2626;">全件リセット</button>
      </div>
    </div>
  </div>

  <!-- 推しメン絞り込みバー -->
  <div class="oshi-bar">
    <label for="oshiInput">🔍 駿河屋検索に掛け合わせる推しメン名（空欄ならテーマ全体で検索）</label>
    <div class="oshi-input-row">
      <input type="text" id="oshiInput" placeholder="例：井上和 / 遠藤さくら / 一ノ瀬美空" oninput="renderCards()" />
    </div>
    <div class="preset-chips">
      <button class="chip" onclick="setOshi('井上和')">井上和</button>
      <button class="chip" onclick="setOshi('遠藤さくら')">遠藤さくら</button>
      <button class="chip" onclick="setOshi('賀喜遥香')">賀喜遥香</button>
      <button class="chip" onclick="setOshi('一ノ瀬美空')">一ノ瀬美空</button>
      <button class="chip" onclick="setOshi('川﨑桜')">川﨑桜</button>
      <button class="chip" onclick="setOshi('五百城茉央')">五百城茉央</button>
      <button class="chip clear" onclick="setOshi('')">クリア</button>
    </div>
  </div>

  <!-- カード一覧（2列グリッド） -->
  <div class="card-list" id="cardList"></div>
</div>

<div class="toast" id="toast">完了しました！</div>

<script>
  const ADMIN_PASS = '4648';
  const STORAGE_KEY = 'nogi_photo_admin_v2';
  let items = [];
  let compressedBase64 = '';
  let editingId = null;

  async function init() {
    // 1. まず同階層の data.json（GitHub上の最新データ）を読み込み
    let loadedFromJson = false;
    try {
      const res = await fetch('./data.json?t=' + Date.now());
      if (res.ok) {
        const json = await res.json();
        if (Array.isArray(json)) {
          items = json;
          loadedFromJson = true;
        }
      }
    } catch (e) {}

    if (!loadedFromJson) {
      const saved = localStorage.getItem(STORAGE_KEY);
      items = saved ? JSON.parse(saved) : [];
    }

    // 2. URLに ?admin=1 がついている場合のみパスワード認証
    const params = new URLSearchParams(location.search);
    if (params.get('admin') === '1') {
      const inputPass = prompt('管理用パスワードを入力してください：');
      if (inputPass === ADMIN_PASS) {
        document.getElementById('adminPanel').classList.add('open');
        document.body.classList.add('is-admin');
      } else if (inputPass !== null) {
        alert('パスワードが違います。閲覧モードで表示します。');
      }
    }

    renderCards();
  }

  function saveLocal() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function setOshi(name) {
    document.getElementById('oshiInput').value = name;
    renderCards();
  }

  function handleImageFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = new Image();
      img.onload = function() {
        const maxSide = 800;
        const scale = Math.max(img.width, img.height) > maxSide
          ? maxSide / Math.max(img.width, img.height)
          : 1;
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);

        const prev = document.getElementById('previewImg');
        prev.src = compressedBase64;
        prev.style.display = 'block';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function startEdit(id) {
    const target = items.find(i => i.id === id);
    if (!target) return;

    editingId = id;
    document.getElementById('formHeading').textContent = '✏️ アイテムを編集中...';
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.textContent = '✔ 変更内容を保存する';
    submitBtn.className = 'btn btn-edit-save';
    document.getElementById('cancelEditBtn').style.display = 'inline-flex';

    document.getElementById('inTitle').value = target.title || '';
    document.getElementById('inDeadline').value = target.deadline || '';
    document.getElementById('inDelivery').value = target.delivery || '';
    document.getElementById('inShopUrl').value = target.shopUrl || 'https://www.nogizaka46shop.com/';
    document.getElementById('inKeyword').value = target.keyword || '';

    // 既存画像プレビュー表示
    compressedBase64 = '';
    document.getElementById('inFile').value = '';
    const prev = document.getElementById('previewImg');
    if (target.banner && target.banner.startsWith('data:')) {
      document.getElementById('inBannerUrl').value = '';
      prev.src = target.banner;
      prev.style.display = 'block';
    } else {
      document.getElementById('inBannerUrl').value = target.banner || '';
      if (target.banner) {
        prev.src = target.banner;
        prev.style.display = 'block';
      } else {
        prev.style.display = 'none';
      }
    }

    renderCards();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEdit() {
    editingId = null;
    resetForm();
    renderCards();
  }

  function resetForm() {
    document.getElementById('formHeading').textContent = '🛠️ 管理画面（新規アイテム登録）';
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.textContent = '＋ この内容で追加する';
    submitBtn.className = 'btn btn-primary';
    document.getElementById('cancelEditBtn').style.display = 'none';

    compressedBase64 = '';
    document.getElementById('inFile').value = '';
    document.getElementById('previewImg').style.display = 'none';
    document.getElementById('inBannerUrl').value = '';
    document.getElementById('inTitle').value = '';
    document.getElementById('inDeadline').value = '';
    document.getElementById('inDelivery').value = '';
    document.getElementById('inShopUrl').value = 'https://www.nogizaka46shop.com/';
    document.getElementById('inKeyword').value = '';
  }

  function saveItem() {
    const title = document.getElementById('inTitle').value.trim();
    const bannerUrlInput = document.getElementById('inBannerUrl').value.trim();
    const deadline = document.getElementById('inDeadline').value;
    const delivery = document.getElementById('inDelivery').value.trim();
    const shopUrl = document.getElementById('inShopUrl').value.trim() || 'https://www.nogizaka46shop.com/';
    const keyword = document.getElementById('inKeyword').value.trim() || title;

    if (!title || !deadline) {
      alert('タイトルと予約締切日時は必須です！');
      return;
    }

    if (editingId) {
      const idx = items.findIndex(i => i.id === editingId);
      if (idx !== -1) {
        const oldBanner = items[idx].banner;
        const newBanner = compressedBase64 || bannerUrlInput || oldBanner;
        items[idx] = {
          ...items[idx],
          title,
          banner: newBanner,
          deadline,
          delivery,
          shopUrl,
          keyword
        };
      }
      editingId = null;
      resetForm();
      saveLocal();
      renderCards();
      showToast('修正を反映しました！忘れずに data.json を保存してください');
    } else {
      const banner = compressedBase64 || bannerUrlInput;
      items.unshift({
        id: 'item-' + Date.now(),
        title,
        banner,
        deadline,
        delivery,
        shopUrl,
        keyword,
        forceResale: false
      });
      resetForm();
      saveLocal();
      renderCards();
      showToast('追加しました！忘れずに data.json を保存してください');
    }
  }

  function toggleMode(id) {
    const target = items.find(i => i.id === id);
    if (target) {
      target.forceResale = !target.forceResale;
      saveLocal();
      renderCards();
    }
  }

  function deleteItem(id) {
    if (!confirm('この項目を削除しますか？')) return;
    if (editingId === id) cancelEdit();
    items = items.filter(i => i.id !== id);
    saveLocal();
    renderCards();
  }

  function clearAllItems() {
    if (!confirm('登録データをすべて空にしますか？')) return;
    editingId = null;
    resetForm();
    items = [];
    saveLocal();
    renderCards();
  }

  function downloadJson() {
    const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'data.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('data.json を保存しました！GitHubにアップしてください');
  }

  function formatCountdown(ms) {
    if (ms <= 0) return '受付終了';
    const totalSec = Math.floor(ms / 1000);
    const d = Math.floor(totalSec / 86400);
    const h = Math.floor((totalSec % 86400) / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return `あと ${d}日 ${String(h).padStart(2,'0')}時間 ${String(m).padStart(2,'0')}分 ${String(s).padStart(2,'0')}秒`;
  }

  function renderCards() {
    const list = document.getElementById('cardList');
    const oshi = document.getElementById('oshiInput').value.trim();
    const now = Date.now();

    if (items.length === 0) {
      list.innerHTML = `<div class="empty-state">現在登録されている生写真はありません。</div>`;
      return;
    }

    list.innerHTML = items.map(item => {
      const endMs = new Date(item.deadline).getTime();
      const diff = endMs - now;
      const isEnded = item.forceResale || diff <= 0;

      const fullQuery = [item.keyword, oshi].filter(Boolean).join(' ');
      const encQuery = encodeURIComponent(fullQuery);
      const surugayaUrl = `https://www.suruga-ya.jp/search?category=&search_word=${encQuery}`;

      const bannerHtml = item.banner
        ? `<img src="${item.banner}" alt="${item.title}" />`
        : `<div class="banner-placeholder">${item.title}</div>`;

      const mainSection = !isEnded
        ? `
          <div class="countdown-box">
            <div class="countdown-label">🔥 締切：${item.deadline.replace('T', ' ')}</div>
            <div class="countdown-time" data-deadline="${endMs}">${formatCountdown(diff)}</div>
          </div>
          <a href="${item.shopUrl}" target="_blank" rel="noopener" class="btn btn-primary" style="width:100%;">
            🛒 公式ショップで購入ページを開く
          </a>
        `
        : `
          <div class="resale-box">
            <div class="resale-title">📦 駿河屋 二次流通・在庫サーチ</div>
            <div class="search-preview">検索：<strong>${fullQuery}</strong></div>
            <a href="${surugayaUrl}" target="_blank" rel="noopener" class="btn btn-surugaya">
              🔍 駿河屋で在庫・相場を検索
            </a>
          </div>
        `;

      return `
        <div class="card ${editingId === item.id ? 'editing' : ''}">
          <div class="banner-wrap">
            <span class="status-badge ${isEnded ? 'badge-ended' : 'badge-active'}">
              ${isEnded ? '駿河屋サーチ中' : '予約受付中'}
            </span>
            ${bannerHtml}
          </div>
          <div class="card-body">
            <div class="card-title">${item.title}</div>
            ${item.delivery ? `<div class="card-meta">お届け目安：${item.delivery}</div>` : ''}
            <div class="card-action-area">
              ${mainSection}
            </div>
            <div class="admin-card-controls">
              <button class="btn btn-outline btn-sm" onclick="startEdit('${item.id}')">
                ✏️ 編集
              </button>
              <button class="btn btn-outline btn-sm" onclick="toggleMode('${item.id}')">
                🔄 ${isEnded ? 'タイマーに戻す' : '駿河屋に切替'}
              </button>
              <button class="btn btn-sm" style="background:#fee2e2; color:#b91c1c;" onclick="deleteItem('${item.id}')">
                削除
              </button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  setInterval(() => {
    const now = Date.now();
    document.querySelectorAll('.countdown-time').forEach(el => {
      const endMs = Number(el.dataset.deadline);
      const diff = endMs - now;
      if (diff <= 0) {
        renderCards();
      } else {
        el.textContent = formatCountdown(diff);
      }
    });
  }, 1000);

  init();
</script>
</body>
</html>
